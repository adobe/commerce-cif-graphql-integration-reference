application:
  actions: actions
  web: web-src
  runtimeManifest:
    packages:
      commerce-cif-graphql-integration-reference:
        license: Apache-2.0
        actions:
          dispatcher:
            function: actions/local/dispatcher.js
            web: 'yes'
            runtime: 'nodejs:22'
            # Example limits, see "Resilience and sizing" in the README. Measure the memory used per request
            # under realistic load, and make sure that concurrency x memory per request fits in memorySize (MB).
            # limits:
            #   concurrency: 50
            #   memorySize: 1024
            inputs:
              LOG_LEVEL: info # use debug only for troubleshooting, parameters are logged with sensitive values hidden
              use-aio-cache: false # number of seconds for caching; set to false or remove to disable caching
              url: https://a-dummy-url.com
              max-page-size: 100 # the maximum "pageSize" of product searches, larger values are clamped to this value
              remoteSchemas: # Action with smaller order has "merge priority" in schema conflicts
                cart:
                  order: 20
                  action: commerce-cif-graphql-integration-reference/cart
            annotations:
              provide-api-key: true
              final: true

          cart:
            function: actions/remote/cartResolver.js
            runtime: 'nodejs:22'
            inputs:
              LOG_LEVEL: info

          # This deploys a GraphQL introspection endpoint that includes all the Magento types and fields
          # used by the AEM/Magento integration.
          cif-schema:
            function: actions/documentation/introspection.js
            runtime: 'nodejs:22'
            web: 'yes'
            annotations:
              final: true
